name: Zmole

options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO

targets:
  Zmole:
    type: application
    platform: macOS
    sources:
      - path: src/zmole
        excludes:
          - Resources/**
          - Info.plist
      - path: src/zmole/Resources/mole
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
      - path: src/zmole/Resources/AppIcon.icns
        buildPhase: resources
      - path: src/zmole/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutupower.zmole
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: src/zmole/Info.plist
    scheme:
      testTargets:
        - ZmoleTests

  ZmoleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests/unit
    dependencies:
      - target: Zmole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutupower.zmole.tests
        GENERATE_INFOPLIST_FILE: YES
