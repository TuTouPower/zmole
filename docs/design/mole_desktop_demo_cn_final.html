<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mole — Mac 系统维护</title>
  <style>

:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#f8f8fa;
  --surface-3:#f1f1f4;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --subtle:#8e8e93;
  --line:rgba(29,29,31,.09);
  --line-strong:rgba(29,29,31,.14);
  --accent:#2f8f68;
  --accent-strong:#237554;
  --accent-soft:#e8f4ee;
  --blue:#3578e5;
  --blue-soft:#eaf1ff;
  --orange:#c8791d;
  --orange-soft:#fff2df;
  --red:#c94343;
  --red-soft:#fff0f0;
  --shadow:0 18px 50px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --shadow-sm:0 5px 18px rgba(0,0,0,.06);
  --radius-xl:22px;
  --radius-lg:17px;
  --radius-md:13px;
  --radius-sm:10px;
  --sidebar:236px;
  --titlebar:54px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-synthesis:none;
  text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-size:14px;line-height:1.45;overflow:hidden}
button,input{font:inherit}
button{border:0}
button:focus-visible,input:focus-visible{outline:3px solid rgba(53,120,229,.3);outline-offset:2px}
.app-shell{height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);background:var(--bg)}
.sidebar{
  display:flex;flex-direction:column;padding:18px 12px 12px;
  background:rgba(245,245,247,.82);border-right:1px solid var(--line);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}
.brand{display:flex;align-items:center;gap:11px;padding:5px 10px 22px}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--subtle);margin-top:1px}
.mole-mark{width:30px;height:30px;position:relative;flex:none}
.mole-face{position:absolute;left:5px;top:7px;width:20px;height:18px;border-radius:10px 10px 8px 8px;background:var(--text)}
.mole-face i{position:absolute;top:6px;width:3px;height:3px;border-radius:50%;background:white}
.mole-face i:first-child{left:5px}.mole-face i:nth-child(2){right:5px}
.mole-face b{position:absolute;width:5px;height:4px;left:7.5px;bottom:3px;border-radius:50%;background:#a0a0a5}
.ear{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--text);top:3px}
.ear-left{left:4px}.ear-right{right:4px}
.sidebar-section-label{padding:7px 10px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8e8e93;font-weight:600}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;
  border-radius:10px;background:transparent;color:#4b4b50;text-align:left;cursor:pointer;
  transition:background .16s ease,color .16s ease,transform .16s ease;
}
.nav-item:hover{background:rgba(0,0,0,.045);color:var(--text)}
.nav-item.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.nav-item span:nth-child(2){flex:1}
.nav-badge{font-size:10px;color:var(--accent-strong);background:var(--accent-soft);padding:3px 6px;border-radius:7px;font-weight:650}
.live-dot{width:6px;height:6px;background:#36a269;border-radius:50%;box-shadow:0 0 0 3px rgba(54,162,105,.11)}
.icon{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:currentColor}
.icon svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-spacer{height:14px}
.sidebar-footer{margin-top:14px;border-top:1px solid var(--line);padding:13px 5px 2px}
.machine{display:flex;align-items:center;gap:9px;padding:8px 7px 10px}
.machine-icon{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.machine-copy{display:flex;flex-direction:column;min-width:0;flex:1}
.machine-copy strong{font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.machine-copy span{font-size:9.5px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:7px;height:7px;border-radius:50%;background:#45a56e;box-shadow:0 0 0 3px rgba(69,165,110,.12)}
.footer-link{display:flex;justify-content:space-between;width:100%;padding:7px;color:var(--subtle);background:none;font-size:10px;cursor:pointer}
.footer-link:hover{color:var(--text)}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:var(--titlebar);flex:none;display:grid;grid-template-columns:120px 1fr 120px;align-items:center;padding:0 17px;border-bottom:1px solid var(--line);background:rgba(245,245,247,.76);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.traffic-lights{display:flex;gap:8px;padding-left:1px}
.traffic{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.traffic.red{background:#ff5f57}.traffic.yellow{background:#febc2e}.traffic.green{background:#28c840}
.window-title{text-align:center;font-size:12px;font-weight:600;color:#5c5c61}
.title-actions{display:flex;justify-content:flex-end;gap:5px}
.icon-button{width:30px;height:30px;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-button:hover{background:rgba(0,0,0,.05);color:var(--text)}
.content{height:calc(100vh - var(--titlebar));overflow:auto;padding:34px 42px 46px}
.page{max-width:1180px;margin:0 auto;animation:pageIn .2s ease-out}
@keyframes pageIn{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.06em;color:var(--accent-strong);text-transform:uppercase;margin-bottom:7px}
h1{font-size:32px;line-height:1.08;letter-spacing:-.045em;margin:0;font-weight:720}
h2{font-size:19px;line-height:1.2;letter-spacing:-.025em;margin:0;font-weight:680}
h3{font-size:15px;margin:0;font-weight:650}
.page-subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}
.page-actions{display:flex;gap:8px;align-items:center}
.button{height:34px;padding:0 14px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:650;cursor:pointer;transition:.15s ease;white-space:nowrap}
.button.primary{background:var(--text);color:white;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.button.primary:hover{background:#333337;transform:translateY(-1px)}
.button.accent{background:var(--accent);color:#fff}
.button.accent:hover{background:var(--accent-strong);transform:translateY(-1px)}
.button.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line-strong)}
.button.secondary:hover{background:var(--surface-3)}
.button.ghost{background:transparent;color:var(--muted)}
.button.ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
.button.danger{background:var(--red);color:#fff}
.button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 1px 1px rgba(0,0,0,.02);overflow:hidden}
.card-pad{padding:21px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.card-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
.kicker{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle);font-weight:650}
.divider{height:1px;background:var(--line);margin:16px 0}
.grid{display:grid;gap:14px}
.overview-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:14px;margin-bottom:14px}
.health-card{min-height:252px;padding:25px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.health-card:after{content:"";position:absolute;width:260px;height:260px;right:-110px;bottom:-150px;border-radius:50%;background:var(--accent-soft)}
.health-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;position:relative;z-index:1}
.health-copy{max-width:430px}
.health-copy .eyebrow{margin-bottom:8px}
.health-copy h2{font-size:24px;letter-spacing:-.035em}
.health-copy p{font-size:12px;color:var(--muted);margin:8px 0 0;max-width:370px}
.health-ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) 0 92%,var(--surface-3) 92% 100%);display:grid;place-items:center;flex:none;position:relative}
.health-ring:after{content:"";width:70px;height:70px;border-radius:50%;background:var(--surface);position:absolute}
.health-score{position:relative;z-index:1;text-align:center}
.health-score strong{display:block;font-size:24px;line-height:1;font-weight:720}
.health-score span{font-size:9px;color:var(--muted)}
.health-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.metric{padding:12px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.metric-label{font-size:10px;color:var(--subtle);display:flex;align-items:center;gap:6px}
.metric-value{font-size:17px;font-weight:680;letter-spacing:-.03em;margin-top:4px}
.metric-note{font-size:10px;color:var(--muted);margin-top:1px}
.metric-note.good{color:var(--accent-strong)}
.disk-card{padding:22px;min-height:252px}
.disk-visual{display:flex;align-items:center;gap:18px}
.disk-ring{width:128px;height:128px;border-radius:50%;background:conic-gradient(#5963d8 0 26%,#8a72ca 26% 37%,#5d9bca 37% 48%,#d8a75c 48% 67%,#b9bdc6 67% 70%,#e9e9ec 70% 100%);display:grid;place-items:center;position:relative;flex:none}
.disk-ring:after{content:"";position:absolute;width:86px;height:86px;border-radius:50%;background:var(--surface)}
.disk-center{position:relative;z-index:1;text-align:center}
.disk-center strong{display:block;font-size:22px;letter-spacing:-.04em}
.disk-center span{font-size:10px;color:var(--muted)}
.storage-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;flex:1}
.legend-item{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}
.legend-dot{width:7px;height:7px;border-radius:3px;flex:none}
.legend-item b{color:var(--text);font-weight:620;margin-left:auto}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick-card{padding:17px;min-height:132px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.quick-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--line-strong)}
.quick-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--text);margin-bottom:12px}
.quick-icon.green{background:var(--accent-soft);color:var(--accent-strong)}
.quick-icon.blue{background:var(--blue-soft);color:var(--blue)}
.quick-icon.orange{background:var(--orange-soft);color:var(--orange)}
.quick-card h3{font-size:13px}
.quick-card p{font-size:10.5px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.lower-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);gap:14px;margin-top:14px}
.activity-row{display:flex;align-items:center;gap:12px;padding:11px 0}
.activity-row + .activity-row{border-top:1px solid var(--line)}
.activity-icon{width:30px;height:30px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted);flex:none}
.activity-copy{flex:1;min-width:0}
.activity-copy strong{font-size:11px;font-weight:620;display:block}
.activity-copy span{font-size:10px;color:var(--subtle)}
.activity-value{text-align:right;font-size:11px;font-weight:650}
.activity-value small{display:block;color:var(--subtle);font-weight:450;margin-top:2px}
.sparkline{height:90px;display:flex;align-items:end;gap:5px;padding:8px 0 3px}
.spark-bar{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(to top,var(--accent),#8bc8aa);min-width:4px;opacity:.9}
.spark-meta{display:flex;justify-content:space-between;color:var(--subtle);font-size:9px;margin-top:3px}
.overview-storage{display:flex;flex-direction:column;gap:15px}
.overview-storage-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.overview-storage-total strong{font-size:24px;letter-spacing:-.04em;display:block}
.overview-storage-total span{font-size:10px;color:var(--muted);display:block;margin-top:3px}
.overview-storage-free{text-align:right}
.overview-storage-free strong{font-size:15px;display:block}
.overview-storage-free span{font-size:10px;color:var(--muted)}
.overview-storage .disk-capacity{margin-top:2px;display:block}
.overview-storage .disk-capacity-bar{height:14px}
.overview-storage .disk-capacity-text{display:flex;justify-content:space-between;margin-top:7px;font-size:10px}
.overview-storage .storage-legend{margin-top:2px}
.overview-status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.overview-status-item{padding:12px 13px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;min-width:0}
.overview-status-item .status-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}
.overview-status-item .status-label .icon{width:14px;height:14px}
.overview-status-item strong{display:block;font-size:17px;letter-spacing:-.03em;margin-top:6px}
.overview-status-item span{display:block;font-size:9px;color:var(--subtle);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}
.list-card{min-width:0}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line)}
.list-head .count{font-size:10px;color:var(--muted);background:var(--surface-3);padding:4px 7px;border-radius:7px}
.search-box{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--subtle)}
.search-box input{border:0;outline:0;background:transparent;width:100%;color:var(--text);font-size:11px}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:var(--surface-2)}
.check{width:17px;height:17px;border:1.5px solid #b8b8bd;border-radius:5px;display:grid;place-items:center;flex:none;background:var(--surface);cursor:pointer}
.check.checked{background:var(--accent);border-color:var(--accent);color:white}
.check.checked:after{content:"✓";font-size:11px;font-weight:700}
.row-icon{width:36px;height:36px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;flex:none;font-size:16px}
.row-copy{flex:1;min-width:0}
.row-copy strong{display:block;font-size:12px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-copy span{display:block;font-size:10px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row-size{text-align:right;font-size:11px;font-weight:620;min-width:64px}
.row-size small{display:block;color:var(--subtle);font-size:9px;font-weight:450;margin-top:2px}
.selection-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.94);border-top:1px solid var(--line-strong);backdrop-filter:blur(18px)}
.selection-bar .selected-summary{flex:1}
.selected-summary strong{font-size:12px}.selected-summary span{font-size:10px;color:var(--muted);margin-left:5px}
.side-card{padding:19px}
.safety-box{padding:12px;border-radius:11px;background:var(--accent-soft);color:#2d604b;font-size:10.5px;line-height:1.5;margin-top:15px}
.safety-box .icon{vertical-align:middle;margin-right:4px}
.path-list{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.path{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--muted);background:var(--surface-2);padding:8px 9px;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-wrap{height:5px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.progress{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-tile{padding:16px 17px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.stat-tile strong{font-size:20px;letter-spacing:-.04em;display:block}
.stat-tile span{font-size:10px;color:var(--muted)}
.stat-tile em{font-style:normal;font-size:9px;color:var(--accent-strong);margin-left:4px}
.tabs{display:flex;gap:3px;padding:3px;background:var(--surface-3);border-radius:9px;width:max-content}
.tab{height:28px;padding:0 10px;border-radius:7px;background:transparent;color:var(--muted);font-size:10px;font-weight:620;cursor:pointer}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.app-detail{padding:20px}
.app-detail-top{display:flex;align-items:center;gap:12px}
.app-large-icon{width:50px;height:50px;border-radius:13px;background:var(--surface-3);display:grid;place-items:center;font-size:25px}
.app-detail-top h2{font-size:17px}.app-detail-top p{font-size:10px;color:var(--muted);margin:3px 0 0}
.app-detail-size{margin-left:auto;text-align:right}.app-detail-size strong{font-size:17px}.app-detail-size span{font-size:9px;color:var(--subtle);display:block}
.detail-section{margin-top:20px}.detail-section h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.detail-item{display:flex;justify-content:space-between;gap:12px;font-size:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.detail-item:last-child{border-bottom:0}.detail-item code{font-family:"SF Mono",ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 磁盘 explorer: keeps the original Mole visual language; only changes the analysis content layout. */
.disk-explorer{display:grid;grid-template-columns:minmax(320px,.82fr) minmax(0,1.48fr);gap:14px;min-height:650px}
.disk-files,.disk-map{min-width:0;min-height:0;display:flex;flex-direction:column}
.disk-file-toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.disk-file-toolbar .search-box{flex:1;min-width:0}
.disk-sort{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:10px;outline:none}
.disk-breadcrumb{display:flex;align-items:center;gap:5px;padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:auto;color:var(--muted);font-size:10px}
.disk-breadcrumb button{background:none;color:var(--muted);padding:3px 5px;border-radius:6px;cursor:pointer;white-space:nowrap}
.disk-breadcrumb button:hover{background:var(--surface-3);color:var(--text)}
.disk-breadcrumb button.current{color:var(--text);font-weight:650}
.disk-file-header{display:grid;grid-template-columns:22px 30px minmax(0,1fr) 74px 68px;gap:9px;padding:8px 14px;color:var(--subtle);font-size:9px;border-bottom:1px solid var(--line)}
.disk-file-list{overflow:auto;min-height:0;flex:1}
.disk-file-row{display:grid;grid-template-columns:22px 30px minmax(0,1fr) 74px 68px;gap:9px;align-items:center;padding:10px 14px;padding-left:calc(14px + (var(--disk-depth, 0) * 18px));border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s ease}
.disk-file-row:last-child{border-bottom:0}
.disk-file-row:hover{background:var(--surface-2)}
.disk-file-row.active{background:var(--accent-soft)}
.disk-disclosure{width:20px;height:20px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--subtle);display:grid;place-items:center;cursor:pointer;transition:background .14s ease,color .14s ease}
.disk-disclosure:hover{background:var(--surface-3);color:var(--text)}
.disk-disclosure .chevron{display:block;font-size:15px;line-height:1;transform:rotate(0deg);transition:transform .16s ease}
.disk-disclosure.expanded .chevron{transform:rotate(90deg)}
.disk-disclosure.placeholder{cursor:default;pointer-events:none}
.disk-disclosure.placeholder .chevron{visibility:hidden}
.disk-file-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted)}
.disk-file-name{min-width:0}

function diskKey(item){
  return item.path || item.name;
}
function flattenDiskItems(items){
  const out=[];
  function walk(list){
    list.forEach(item=>{
      out.push(item);
      if(item.children && item.children.length) walk(item.children);
    });
  }
  walk(items);
  return out;
}
function toggleDiskExpanded(key){
  if(diskExpanded.has(key)) diskExpanded.delete(key);
  else diskExpanded.add(key);
}
function renderDiskTreeRows(items, currentSize, depth=0){
  const rows=[];
  items.forEach(item=>{
    const active = diskSelected === diskKey(item);
    const percent = currentSize ? item.size/currentSize*100 : 0;
    const hasChildren = !!(item.children && item.children.length);
    const expanded = hasChildren && diskExpanded.has(diskKey(item));
    rows.push(`<div class="disk-file-row ${active?'active':''}" style="--disk-depth:${depth}" data-disk-item="${esc(diskKey(item))}" data-disk-name="${esc(item.name)}" data-disk-enter="${hasChildren?'1':'0'}">
      ${hasChildren
        ? `<button class="disk-disclosure ${expanded?'expanded':''}" data-disk-toggle="${esc(diskKey(item))}" aria-label="${expanded?'折叠':'展开'} ${esc(item.name)}"><span class="chevron">›</span></button>`
        : `<span class="disk-disclosure placeholder"><span class="chevron">›</span></span>`}
      <div class="disk-file-icon">${icon(item.type==='folder'?'folder':'package')}</div>
      <div class="disk-file-name">
        <strong>${esc(item.name)}</strong>
        <span>${esc(item.path)} · ${percent.toFixed(1)}%</span>
      </div>
      <div class="disk-file-type">${item.type==='folder'?'文件夹':'文件'}</div>
      <div class="disk-file-size">${fmtGB(item.size)}</div>
    </div>`);
    if(expanded) rows.push(renderDiskTreeRows(item.children, currentSize, depth+1));
  });
  return rows.join('');
}

function getDiskNode(){
  let node=diskRoot;
  for(const name of diskPath){
    const next=(node.children||[]).find(x=>x.name===name);
    if(next) node=next;
  }
  return node;
}
function getDiskChildren(node){
  return [...(node.children||[])];
}
function navigateDiskTo(index){
  if(index < 0) diskPath=[];
  else diskPath=diskPath.slice(0,index+1);
  diskSelected='';
  diskQuery='';
  diskExpanded.clear();
  render();
}
function findDiskTrail(items, key, trail=[]){
  for(const item of items){
    const nextTrail = [...trail, item.name];
    if(diskKey(item)===key || item.name===key) return {item, trail:nextTrail};
    if(item.children && item.children.length){
      const found = findDiskTrail(item.children, key, nextTrail);
      if(found) return found;
    }
  }
  return null;
}
function enterDiskItem(nameOrPath){
  const current=getDiskNode();
  const found=findDiskTrail(current.children||[], nameOrPath);
  if(found && found.item && found.item.children && found.item.children.length){
    diskPath = diskPath.concat(found.trail);
    diskSelected='';
    diskQuery='';
    diskExpanded.clear();
    render();
  }
}
function layoutDiskTreemap(items){
  const sorted=[...items].sort((a,b)=>b.size-a.size);
  function sum(arr){return arr.reduce((n,x)=>n+x.size,0)||1;}
  function split(arr,x,y,w,h){
    if(!arr.length) return [];
    if(arr.length===1) return [{item:arr[0],x,y,w,h}];
    const total=sum(arr);
    let acc=0, cut=1, best=Infinity;
    for(let i=1;i<arr.length;i++){
      acc+=arr[i-1].size;
      const ratio=acc/total;
      const score=Math.abs(ratio-.5);
      if(score<best){best=score;cut=i;}
    }
    const a=arr.slice(0,cut), b=arr.slice(cut);
    const ratio=sum(a)/total;
    if(w>=h){
      const w1=w*ratio;
      return [...split(a,x,y,w1,h),...split(b,x+w1,y,w-w1,h)];
    }else{
      const h1=h*ratio;
      return [...split(a,x,y,w,h1),...split(b,x,y+h1,w,h-h1)];
    }
  }
  return split(sorted,0,0,100,100);
}

function renderDisk(){
  const current = getDiskNode();
  let items = getDiskChildren(current);

  if(diskQuery.trim()){
    const q=diskQuery.trim().toLowerCase();
    items=items.filter(x => (x.name+' '+x.path).toLowerCase().includes(q));
  }

  items.sort((a,b)=>{
    if(diskSort==='name') return a.name.localeCompare(b.name,'zh-Hans-CN');
    if(diskSort==='type') return (a.type||'').localeCompare(b.type||'');
    return b.size-a.size;
  });

  const visibleItems = flattenDiskItems(items);
  if(!visibleItems.some(x=>diskKey(x)===diskSelected)) diskSelected=diskKey(items[0]) || '';

  const selected=visibleItems.find(x=>diskKey(x)===diskSelected) || null;
  const crumbs=[{name:'Macintosh HD',index:-1},...diskPath.map((name,i)=>({name,index:i}))];

  return `<section class="page">

          <span class="tag">${fmtGB(current.size)}</span>
        </div>

        <div class="disk-file-toolbar">
          <div class="search-box">${icon('search')}<input id="diskSearch" value="${esc(diskQuery)}" placeholder="搜索当前目录…" autocomplete="off"></div>
          <select id="diskSort" class="disk-sort" aria-label="排序">
            <option value="size" ${diskSort==='size'?'selected':''}>按大小</option>

        </div>

        <div class="disk-file-list">
          ${items.length ? renderDiskTreeRows(items, current.size) : `<div class="empty"><strong>没有匹配项目</strong><span>尝试更换搜索条件。</span></div>`}
        </div>

        <div class="disk-list-footer">

      </article>
    </div>
  </section>`;
}

    ${installers.map(x=>`<div class="list-row"><button class="check ${selectedInstaller.has(x.id)?'checked':''}" data-installer-toggle="${x.id}"></button><div class="row-icon">${x.type}</div><div class="row-copy"><strong>${esc(x.name)}</strong><span>${x.path} · ${x.type}</span></div><div class="row-size">${x.size.toFixed(2)} GB<small>已下载</small></div></div>`).join('')}
    <div class="selection-bar"><div class="selected-summary"><strong>${fmtGB(total)}</strong><span>${selectedInstaller.size} 个文件已选择</span></div><button class="button accent" data-action="installerClean" ${total===0?'disabled':''}>移到废纸篓 ${icon('trash')}</button></div></article>
  </section>`;
}

  <article class="card"><div class="history-row header"><span>日期</span><span>操作</span><span style="text-align:right">结果</span><span style="text-align:right">状态</span></div>${rows.map(r=>`<div class="history-row"><span>${r[0]}</span><strong>${r[1]}</strong><span class="history-size">${r[2]}</span><span class="history-status">${r[3]}</span></div>`).join('')}</article>
  <div class="info-banner" style="margin-top:14px">${icon('shield')}清理历史记录保存在本机。除非关闭日志，否则 Mole 会记录本地操作。</div>
  </section>`;

function renderSettings(){
  return `<section class="page"><div class="page-head"><div><div class="eyebrow">偏好设置</div><h1>设置</h1><p class="page-subtitle">让 Mole 适配你的工作流，同时不隐藏任何安全决策。</p></div></div>
  <article class="card">
    <div class="settings-section"><div class="kicker">清理</div>
      ${settingRow('移除前检查','执行破坏性操作前始终显示最终列表。',true,'review')}
      ${settingRow('将移除的文件移到废纸篓','在命令支持的情况下保留可恢复性。',true,'trash')}
      ${settingRow('包含浏览器缓存','清理时显示 Safari 和 Chrome 缓存。',true,'browser')}
    </div>
    <div class="settings-section"><div class="kicker">开发者</div>
      ${settingRow('项目扫描路径','扫描可重建产物时使用已配置的文件夹。',true,'project')}
      ${settingRow('保护活跃仓库','跳过看起来属于活跃 Git 仓库的文件夹。',true,'git')}
    </div>
    <div class="settings-section"><div class="kicker">系统</div>
      ${settingRow('登录时启动','保持轻量的菜单栏伴侣可用。',false,'login')}
      <div class="setting-row"><div class="setting-copy"><strong>外观</strong><span>跟随 Mac 系统外观。</span></div><select class="select"><option>系统</option><option>浅色</option><option>深色</option></select></div>
      <div class="setting-row"><div class="setting-copy"><strong>语言</strong><span>桌面端客户端的界面语言。</span></div><select class="select"><option>简体中文</option><option>English</option></select></div>
    </div>
    <div class="settings-section"><div class="kicker">高级</div>
      <div class="setting-row"><div class="setting-copy"><strong>白名单</strong><span>受保护路径和维护排除项。</span></div><button class="button secondary" data-action="whitelist">管理</button></div>
      <div class="setting-row"><div class="setting-copy"><strong>CLI 集成</strong><span>桌面端使用已安装的 <code>mo</code> 二进制执行实际操作。</span></div><span class="tag good">${icon('check')} 已连接</span></div>
    </div>

function settingRow(title,desc,on,id){
  return `<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><span>${desc}</span></div><button class="toggle ${on?'on':''}" data-setting="${id}" aria-label="切换 ${title}"></button></div>`;
}

function bindPageEvents(){
  document.querySelectorAll('[data-page-action]').forEach(el=>el.addEventListener('click',()=>setPage(el.dataset.pageAction)));
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action)));
  document.querySelectorAll('[data-clean-toggle]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const id=el.dataset.cleanToggle;
    selectedClean.has(id)?selectedClean.delete(id):selectedClean.add(id);
    render();
  }));
  document.querySelectorAll('[data-installer-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.installerToggle;
    selectedInstaller.has(id)?selectedInstaller.delete(id):selectedInstaller.add(id);
    render();
  }));
  document.querySelectorAll('[data-toggle-task]').forEach(el=>el.addEventListener('click',()=>{
    const t=optimizeTasks.find(x=>x.id===el.dataset.toggleTask); if(t)t.on=!t.on; render();
  }));
  document.querySelectorAll('[data-setting]').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('on')));
  document.querySelectorAll('[data-app-id]').forEach(el=>el.addEventListener('click',()=>{selectedApp=el.dataset.appId;render()}));
  const search=document.getElementById('appSearch');
  if(search) search.addEventListener('input',()=>{
    const q=search.value.toLowerCase();
    document.querySelectorAll('[data-app-id]').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'flex':'none');
  });
  document.querySelectorAll('[data-purge-check]').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('checked')));

  // Disk explorer interactions: list, disclosure tree and treemap stay synchronized.
  document.querySelectorAll('[data-disk-toggle]').forEach(el=>{
    el.addEventListener('click',(event)=>{
      event.stopPropagation();
      toggleDiskExpanded(el.dataset.diskToggle);
      render();
    });
  });
  document.querySelectorAll('[data-disk-item]').forEach(el=>{
    el.addEventListener('click',()=>{
      diskSelected=el.dataset.diskItem;
      render();
    });
    el.addEventListener('dblclick',()=>{
      if(el.dataset.diskEnter==='1') enterDiskItem(el.dataset.diskItem);
    });
  });
  document.querySelectorAll('[data-disk-crumb]').forEach(el=>{
    el.addEventListener('click',()=>navigateDiskTo(Number(el.dataset.diskCrumb)));
  });
  const diskBack=document.querySelector('[data-disk-back]');
  if(diskBack) diskBack.addEventListener('click',()=>{
    if(diskPath.length){diskPath.pop();diskSelected='';diskQuery='';diskExpanded.clear();render();}
  });
  const diskSearch=document.getElementById('diskSearch');
  if(diskSearch) diskSearch.addEventListener('input',()=>{
    const value=diskSearch.value;
    diskQuery=value;
    render();
    const next=document.getElementById('diskSearch');
    if(next){next.focus();next.setSelectionRange(value.length,value.length);}
  });
  const diskSortEl=document.getElementById('diskSort');
  if(diskSortEl) diskSortEl.addEventListener('change',()=>{
    diskSort=diskSortEl.value;
    render();
  });
  const diskEnter=document.querySelector('[data-disk-enter-selected]');
  if(diskEnter) diskEnter.addEventListener('click',()=>{
    if(diskSelected) enterDiskItem(diskSelected);
  });
}

function handleAction(action){
  switch(action){
    case 'clean': setPage('clean'); break;
    case 'scan': scanning=true; render(); setTimeout(()=>{scanning=false;showToast('扫描完成 · 可回收 12.4 GB');render()},900); break;
    case 'selectAll': selectedClean = selectedClean.size===cleanItems.length ? new Set() : new Set(cleanItems.map(x=>x.id)); render(); break;
    case 'cleanSelected':
      openModal('清理所选项目',`Mole 已准备处理 ${fmtGB(totalSelected())}，共 ${selectedClean.size} 项。检查已完成，受保护路径已排除。`,'立即清理',()=>{
        const freed=totalSelected(); selectedClean.clear(); showToast(`清理完成 · ${fmtGB(freed)} 已回收`); render();
      }); break;
    case 'uninstall':
      { const app=apps.find(a=>a.id===selectedApp); if(!app)return;
        openModal(`移除 ${app.name}?`,`应用及 ${app.size.toFixed(2)} GB 相关文件将在支持的情况下移到废纸篓。个人数据默认保留。`,'移到废纸篓',()=>{
          const idx=apps.findIndex(a=>a.id===app.id); apps.splice(idx,1); selectedApp=apps[Math.max(0,idx-1)]?.id; showToast(`${app.name} 已移到废纸篓`); render();
        },'⌫'); } break;
    case 'finder': showToast('Finder 预览在此浏览器 Demo 中为模拟操作'); break;
    case 'scanApps': showToast('应用列表已刷新'); break;
    case 'disk': setPage('disk'); break;
    case 'analyze': showToast('磁盘分析已刷新 · 已扫描 926 GB'); break;
    case 'optimize': {
      const n=optimizeTasks.filter(t=>t.on).length;
      openModal('运行优化？',`${n} 项有边界的维护任务已选择。Mole 会跳过当前不可用的任务，并说明原因。`,'运行任务',()=>{showToast(`优化完成 · ${n} 项任务已处理`);});
      } break;
    case 'dryRun': showToast('模拟运行 完成 · 未进行任何修改'); break;
    case 'settings': setPage('settings'); break;
    case 'whitelist': showToast('白名单编辑器已在 Demo 模式打开'); break;
    case 'status': setPage('status'); break;
    case 'purge': setPage('purge'); break;
    case 'purgeScan': showToast('项目扫描完成 · 找到 8.7 GB'); break;
    case 'purgeRun': openModal('清理所选项目产物？','仅包含可重建的项目产物。运行中的文件夹和受 Git 跟踪的文件夹会被排除。','立即清理',()=>showToast('清理完成 · 回收 8.7 GB')); break;
    case 'installers': setPage('installers'); break;
    case 'selectInstallers': selectedInstaller=selectedInstaller.size===installers.length?new Set():new Set(installers.map(x=>x.id)); render(); break;
    case 'installerClean': {
      const n=installers.filter(x=>selectedInstaller.has(x.id)).reduce((a,x)=>a+x.size,0);
      openModal('移除安装包？',`${fmtGB(n)} 个已下载的安装包将移到废纸篓。`,'移到废纸篓',()=>{selectedInstaller.clear();showToast(`安装包清理完成 · ${fmtGB(n)} 已回收`);render();});
      } break;
    case 'history': setPage('history'); break;
    case 'historyExport': showToast('历史记录 JSON 已准备导出'); break;
    case 'refresh': showToast('状态检查已刷新'); break;
    default: break;
  }
}

document.getElementById('globalSearch').addEventListener('click',()=>openPalette());
document.getElementById('menuButton').addEventListener('click',()=>openPalette());
document.getElementById('aboutBtn').addEventListener('click',()=>showToast('Mole 1.56.0 · 桌面端概念 Demo'));

const paletteItems = [
  ['overview','概览','查看 Mac 整体状态','home'],
  ['clean','清理','检查可回收空间','sparkle'],
  ['uninstall','卸载','安全卸载应用','app'],
  ['disk','磁盘','分析存储空间占用','pie'],
  ['optimize','优化','运行有边界的维护任务','gauge'],
  ['status','状态','查看实时系统指标','activity'],
  ['purge','项目清理','清理可重建的开发产物','code'],
  ['installers','安装包','清理已下载的安装包','box'],
  ['history','历史记录','查看操作记录','history'],
  ['settings','设置','配置 Mole','settings']
];
let paletteSelected=0;
function openPalette(){
  palette.classList.add('show');palette.setAttribute('aria-hidden','false');paletteInput.value='';paletteSelected=0;renderPalette();setTimeout(()=>paletteInput.focus(),20);
}
function closePalette(){palette.classList.remove('show');palette.setAttribute('aria-hidden','true')}
function renderPalette(){
  const q=paletteInput.value.toLowerCase();
  const filtered=paletteItems.filter(x=>(x[1]+' '+x[2]).toLowerCase().includes(q));
  if(paletteSelected>=filtered.length)paletteSelected=Math.max(0,filtered.length-1);
  document.getElementById('paletteResults').innerHTML=filtered.map((x,i)=>`<div class="palette-result ${i===paletteSelected?'selected':''}" data-palette-page="${x[0]}">${icon(x[3])}<strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('') || '<div class="empty"><strong>没有结果</strong><span>请尝试其他命令。</span></div>';
  document.querySelectorAll('[data-palette-page]').forEach(el=>el.addEventListener('click',()=>{closePalette();setPage(el.dataset.palettePage)}));
}
paletteInput.addEventListener('input',()=>{paletteSelected=0;renderPalette()});
document.addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(palette.classList.contains('show')){
    if(e.key==='Escape'){closePalette()}
    else if(e.key==='ArrowDown'){e.preventDefault();paletteSelected++;renderPalette()}
    else if(e.key==='ArrowUp'){e.preventDefault();paletteSelected--;if(paletteSelected<0)paletteSelected=0;renderPalette()}
    else if(e.key==='Enter'){const el=document.querySelectorAll('[data-palette-page]')[paletteSelected];if(el){closePalette();setPage(el.dataset.palettePage)}}
  }
});
palette.addEventListener('click',e=>{if(e.target===palette)closePalette()});

function updateStatusNumbers(){
  const cpu=36+Math.round(Math.sin(statusTick/3)*8);
  const mem=58+Math.round(Math.cos(statusTick/4)*3);
  const c=document.getElementById('cpuStat'),m=document.getElementById('memStat');
  if(c)c.textContent=`${cpu}%`; if(m)m.textContent=`${mem}%`;
}
setInterval(()=>{statusTick++;if(currentPage==='status')updateStatusNumbers()},2000);

render();

</script>
