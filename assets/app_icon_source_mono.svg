<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <!-- 纯白背景 (#FFFFFF) -->
  <rect width="1200" height="1200" fill="#FFFFFF" />
  
  <!-- 纯黑图形主体 (#000000)，四周留白 100px -->
  <g transform="translate(100, 100)" fill="#000000">
    <!-- 1. 左上 "7" 字形折角模块 -->
    <polygon points="204.8,0 783.0,0 0,921.2 0,748.2 431.2,241.0 0,241.0" />
    
    <!-- 2. 中心贯穿平行四边形斜杠 -->
    <polygon points="850.0,0 1000.0,0 150.0,1000.0 0,1000.0" />
    
    <!-- 3. 右下 180° 中心对称折角模块 -->
    <polygon points="795.2,1000.0 217.0,1000.0 1000.0,78.8 1000.0,251.8 568.8,759.0 1000.0,759.0" />
  </g>
</svg>
